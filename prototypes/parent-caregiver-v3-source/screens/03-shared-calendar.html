<div style="flex:1;overflow-y:auto;padding:8px 20px 100px;display:flex;flex-direction:column;gap:16px" data-screen-label="Shared calendar">
        
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="font-family:'Merriweather';font-weight:700;font-size:24px;color:#1F2937">Family calendar</div>
          <sc-if value="{{isParent}}" hint-placeholder-val="{{true}}"><button style="width:38px;height:38px;border-radius:50%;background:#3B2513;border:none;color:#FFF9F0;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center">+</button></sc-if>
        </div>
        <div style="font-size:13px;color:#6B7280;line-height:1.5;margin-top:-8px">{{calSub}}</div>
        <sc-for list="{{events}}" as="e" hint-placeholder-count="3">
          <div style="background:#fff;border:1px solid #E6EBF3;border-radius:8px;overflow:hidden">
            <div sc-camel-on-click="{{e.open}}" style="padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer">
              <div style="{{e.datebox}}">
                <span style="font-family:'Urbanist';font-weight:600;font-size:9.5px">{{e.dow}}</span>
                <span style="font-family:'Merriweather';font-weight:700;font-size:18px;color:#1F2937">{{e.dom}}</span>
              </div>
              <div style="flex:1">
                <div style="font-family:'Urbanist';font-weight:700;font-size:14.5px;color:#1F2937">{{e.name}}</div>
                <div style="font-size:12.5px;color:#6B7280;margin-top:2px">{{e.meta}}</div>
              </div>
              <span style="{{e.chip}}">{{e.chipLabel}}</span>
            </div>
            <sc-if value="{{e.isOpen}}" hint-placeholder-val="{{false}}">
              <div style="border-top:1px solid #F1E6D6;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#FFFDF8">
                <div style="background:#F7E8D4;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#3B2513;font-weight:600;line-height:1.5">📌 {{e.note}}</div>
                <div style="font-family:'Urbanist';font-weight:600;font-size:11px;letter-spacing:.08em;color:#9A6033">{{e.prepLabel}}</div>
                <sc-for list="{{e.prep}}" as="p" hint-placeholder-count="4">
                  <div sc-camel-on-click="{{p.toggle}}" style="{{p.row}}">
                    <span style="{{p.circle}}">
                      <sc-if value="{{p.done}}" hint-placeholder-val="{{false}}"><svg width="12" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
                    </span>
                    <span style="{{p.text}}">{{p.name}}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
