<div style="flex:1;overflow-y:auto;padding:8px 20px 100px;display:flex;flex-direction:column;gap:16px" data-screen-label="Tutor · Students">
        <div>
          <div style="font-family:'Merriweather';font-weight:700;font-size:24px;color:#1F2937">Students</div>
          <div style="font-family:'Urbanist';font-size:13px;color:#6B7280;margin-top:2px">Mastery updates here go straight to the parents' Learning tab.</div>
        </div>
        <sc-for list="{{kids}}" as="k" hint-placeholder-count="2">
          <div style="background:#fff;border:1px solid #E6EBF3;border-radius:8px;overflow:hidden">
            <div sc-camel-on-click="{{k.open}}" style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer">
              <div style="width:40px;height:40px;border-radius:50%;background:#E0BFA0;border:1px solid #D4A67F;display:flex;align-items:center;justify-content:center;font-family:'Urbanist';font-weight:700;font-size:14px;color:#3B2513;flex:none">{{k.init}}</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Urbanist';font-weight:700;font-size:14.5px;color:#1F2937">{{k.name}}</div>
                <div style="font-size:12px;color:#6B7280;margin-top:1px">{{k.meta}}</div>
              </div>
              <span style="{{k.streakChip}}">{{k.streak}}</span>
            </div>
            <sc-if value="{{k.isOpen}}" hint-placeholder-val="{{false}}">
              <div style="padding:2px 16px 16px;display:flex;flex-direction:column;gap:11px">
                <sc-for list="{{k.topics}}" as="t" hint-placeholder-count="3">
                  <div style="display:flex;flex-direction:column;gap:5px">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                      <span style="font-size:12.5px;font-weight:600;color:#1F2937">{{t.n}}</span>
                      <span style="{{t.lvChip}}">{{t.lv}}</span>
                    </div>
                    <div style="height:6px;background:#F1E6D6;border-radius:99px;overflow:hidden"><div style="{{t.bar}}"></div></div>
                  </div>
                </sc-for>
                <div style="font-size:12.5px;color:#1F2937;font-weight:600">📊 {{k.quiz}}</div>
                <div style="background:#F9F1E6;border-radius:8px;padding:9px 12px;font-size:12px;color:#3B2513;font-weight:600;line-height:1.5">💡 {{k.focus}}</div>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <div style="background:#fff;border:1px solid #E6EBF3;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px">
          <span style="font-family:'Urbanist';font-weight:700;font-size:14px;color:#1F2937">Homework — marked by you, visible to parents</span>
          <sc-for list="{{hwList}}" as="h" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #F1E6D6">
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:600;color:#1F2937">{{h.child}} · {{h.task}}</div>
                <div style="font-size:11.5px;color:#6B7280;margin-top:1px">{{h.due}}</div>
              </div>
              <span style="{{h.chip}}">{{h.st}}</span>
            </div>
          </sc-for>
        </div>
      </div>
