<div style="flex:1;overflow-y:auto;padding:8px 20px 100px;display:flex;flex-direction:column;gap:16px" data-screen-label="Parent · Activity trail">
        <button sc-camel-on-click="{{goHome}}" style="align-self:flex-start;background:none;border:none;padding:0;font-family:'Urbanist';font-weight:700;font-size:13.5px;color:#9A6033;cursor:pointer">← Home</button>
        <div style="font-family:'Merriweather';font-weight:700;font-size:24px;color:#1F2937">Blessing's activity</div>
        <div style="font-size:13px;color:#6B7280;line-height:1.5;margin-top:-8px">The important actions only — care, money, media and what she asks CEeven. Openness that builds trust both ways.</div>
        <div style="background:#EFF6FF;border:1px solid #3B82F6;border-radius:8px;padding:10px 14px;font-size:12.5px;color:#1F2937;font-weight:600">🔒 Photos &amp; videos are taken inside the app and go straight to your family vault — they are never saved on Blessing's phone.</div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <sc-for list="{{audit}}" as="a" hint-placeholder-count="6">
            <div style="display:flex;gap:12px;padding:0 2px">
              <div style="display:flex;flex-direction:column;align-items:center;width:14px;flex:none">
                <span style="{{a.dot}}"></span>
                <span style="width:1.5px;flex:1;background:#EDD9C0"></span>
              </div>
              <div style="padding-bottom:16px;flex:1">
                <div style="display:flex;justify-content:space-between;gap:8px;align-items:center">
                  <span style="{{a.badge}}">{{a.cat}}</span>
                  <span style="font-size:11.5px;color:#6B7280;flex:none">{{a.time}}</span>
                </div>
                <div style="font-size:13px;color:#1F2937;font-weight:600;margin-top:5px;line-height:1.5">{{a.text}}</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
