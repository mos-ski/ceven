<div style="position:absolute;inset:0;background:#1F1108;display:flex;flex-direction:column;z-index:6" data-screen-label="Caregiver · Family camera">
        <div style="flex:none;display:flex;justify-content:space-between;align-items:center;padding:52px 20px 12px">
          <div style="font-family:'Urbanist';font-weight:700;font-size:15px;color:#FFF9F0">Family camera</div>
          <button sc-camel-on-click="{{closeCam}}" style="background:none;border:none;font-size:20px;color:#E0BFA0;cursor:pointer">✕</button>
        </div>
        <div style="flex:none;margin:0 20px;background:rgba(224,191,160,.15);border:1px solid rgba(224,191,160,.4);border-radius:8px;padding:9px 14px;font-size:12px;color:#E0BFA0;font-weight:600;text-align:center">🔒 Goes straight to the family vault — nothing is saved on this phone</div>
        <div style="flex:1;margin:14px 20px;border-radius:12px;background:repeating-linear-gradient(45deg,#2E1C0E,#2E1C0E 12px,#352112 12px,#352112 24px);display:flex;align-items:center;justify-content:center">
          <span style="font-family:ui-monospace,monospace;font-size:11.5px;color:#9A6033">[ camera preview ]</span>
        </div>
        <div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px 40px">
          <div style="display:flex;gap:4px;background:rgba(255,249,240,.1);border-radius:99px;padding:3px">
            <button sc-camel-on-click="{{camPhoto}}" style="{{camPhotoStyle}}">Photo</button>
            <button sc-camel-on-click="{{camVideo}}" style="{{camVideoStyle}}">Video</button>
          </div>
          <button sc-camel-on-click="{{capture}}" style="width:72px;height:72px;border-radius:50%;background:#FFF9F0;border:4px solid #E0BFA0;cursor:pointer;display:flex;align-items:center;justify-content:center">
            <sc-if value="{{camIsVideo}}" hint-placeholder-val="{{false}}"><span style="width:26px;height:26px;border-radius:6px;background:#CD3030"></span></sc-if>
          </button>
          <span style="font-family:'Urbanist';font-size:12px;color:#E0BFA0">{{camHint}}</span>
        </div>
      </div>
